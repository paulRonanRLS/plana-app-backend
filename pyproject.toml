[tool.poetry]
name = "recipe-app-backend"
version = "0.1.0"
description = "Recipe App API - Capture, Collect, Cook"
authors = ["Paul"]
readme = "README.md"
package-mode= false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
alembic = "^1.14.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
redis = "^5.0.0"
hiredis = "^3.0.0"
python-multipart = "^0.0.18"
google-cloud-vision = "^3.8.0"
google-cloud-storage = "^2.14.0"
httpx = "^0.28.0"
python-dotenv = "^1.0.0"
firebase-admin = "^6.6.0"
anthropic = "^0.43.0"
trafilatura = "^2.0.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.0.0"
requests = "^2.32.0"
pillow = "^11.0.0"
toml = "^0.10.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: marks tests that require real external services (Claude API, etc.) - run manually only"
]

[tool.ruff]
target-version = "py311"
line-length = 100
