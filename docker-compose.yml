services:
  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: plana
      POSTGRES_USER: plana_user
      POSTGRES_PASSWORD: plana_dev_password
    volumes:
      - timescale_data:/var/lib/postgresql/data

  cache:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  timescale_data:
  redis_data:
