<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>planA — Connectors</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .badge-ok       { background: var(--rag-green); color: #fff; }
    .badge-stale    { background: var(--rag-amber); color: #fff; }
    .badge-never    { background: var(--light-grey); color: var(--text-secondary); border: 1px solid var(--border); }
    .badge-enabled  { background: var(--teal);       color: #fff; }
    .badge-disabled { background: var(--light-grey); color: var(--text-secondary); border: 1px solid var(--border); }

    .connector-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
    }

    .connector-card .memoir-header h3 {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .connector-badges {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .connector-meta {
      font-size: 0.825rem;
      color: var(--text-secondary);
      margin-bottom: 0.625rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1.25rem;
    }

    .connector-meta .sync-age { font-style: italic; }

    .connector-stat {
      font-size: 0.825rem;
      color: var(--text-secondary);
      margin-bottom: 0.875rem;
    }
    .connector-stat strong {
      color: var(--navy);
      font-variant-numeric: tabular-nums;
    }

    .connector-action-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.875rem;
    }

    .cooldown-label {
      font-size: 0.775rem;
      color: var(--text-secondary);
    }

    .log-details {
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }

    .log-details summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-secondary);
      user-select: none;
    }
    .log-details summary::-webkit-details-marker { display: none; }
    .log-details summary::before {
      content: "▸";
      display: inline-block;
      transition: transform 0.15s;
    }
    .log-details[open] summary::before { transform: rotate(90deg); }

    .attempt-log {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.775rem;
      margin-top: 0.625rem;
    }
    .attempt-log th {
      text-align: left;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-secondary);
      padding: 0 0.75rem 0.35rem 0;
      border-bottom: 1px solid var(--border);
    }
    .attempt-log td {
      padding: 0.3rem 0.75rem 0.3rem 0;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      color: var(--text-secondary);
    }
    .attempt-log tr:last-child td { border-bottom: none; }
    .log-ok      { color: var(--rag-green); font-weight: 600; }
    .log-error   { color: var(--rag-red);   font-weight: 600; }
    .log-skipped { color: var(--rag-none); }
    .log-ts      { white-space: nowrap; color: var(--text-secondary); }
    .log-count   { font-variant-numeric: tabular-nums; color: var(--navy); font-weight: 600; }

    .count-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 0.75rem;
    }

    .count-tile {
      background: var(--light-grey);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      text-align: center;
    }

    .count-value {
      display: block;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--navy);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .count-source {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <span class="brand">planA</span>
  <a href="index.html">Now</a>
  <a href="goals.html">Goals</a>
  <a class="disabled" title="Coming soon">Tension Map</a>
  <a href="reflection.html">Reflection</a>
  <a href="connectors.html" class="active">Connectors</a>
</nav>

<main>
  <div class="section">
    <div class="section-header"><h2>Data Connectors</h2></div>
    <div class="section-body">
      <div class="connector-grid" id="connector-grid">
        <div class="loading">Loading…</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header"><h2>Records by Source</h2></div>
    <div class="section-body">
      <div class="count-grid" id="count-grid">
        <div class="loading">Loading…</div>
      </div>
    </div>
  </div>
</main>

<script>
const COOLDOWN_MS = 30_000;
const syncCooldowns = {};

function statusBadge(status) {
  if (status === 'green') return '<span class="badge badge-ok">OK</span>';
  if (status === 'amber' || status === 'red') return '<span class="badge badge-stale">Stale</span>';
  return '<span class="badge badge-never">Never</span>';
}

function enabledBadge(enabled) {
  return enabled
    ? '<span class="badge badge-enabled">Enabled</span>'
    : '<span class="badge badge-disabled">Disabled</span>';
}

function formatTs(iso) {
  if (!iso) return null;
  return new Date(iso).toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });
}

function syncAgeText(iso) {
  if (!iso) return null;
  const hours = (Date.now() - new Date(iso).getTime()) / 3_600_000;
  if (hours < 1)  return `${Math.round(hours * 60)} min ago`;
  if (hours < 24) return `${Math.round(hours)} hr ago`;
  const days = Math.floor(hours / 24);
  return `${days} day${days === 1 ? '' : 's'} since last sync`;
}

function renderLog(entries) {
  if (!entries || entries.length === 0) {
    return '<p style="font-size:0.8rem;color:var(--text-secondary);margin-top:0.5rem">No attempts recorded yet.</p>';
  }
  const rows = entries.map(e => {
    const cls = e.status === 'ok' ? 'log-ok' : e.status === 'error' ? 'log-error' : 'log-skipped';
    return `<tr>
      <td class="log-ts">${formatTs(e.ts) || e.ts || '—'}</td>
      <td class="${cls}">${e.status}</td>
      <td class="log-count">${e.count ?? '—'}</td>
      <td>${e.msg || ''}</td>
    </tr>`;
  }).join('');
  return `<table class="attempt-log">
    <thead><tr><th>Time</th><th>Status</th><th>Count</th><th>Message</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function startCooldown(source, btn, label) {
  syncCooldowns[source] = Date.now() + COOLDOWN_MS;
  btn.disabled = true;
  const iv = setInterval(() => {
    const rem = Math.ceil((syncCooldowns[source] - Date.now()) / 1000);
    if (rem <= 0) {
      clearInterval(iv);
      btn.disabled = false;
      label.textContent = '';
    } else {
      label.textContent = `Next sync in ${rem}s`;
    }
  }, 500);
}

function renderConnector(source, data) {
  const ageText = syncAgeText(data.last_sync);
  const lastSyncStr = formatTs(data.last_sync);

  const metaLines = [
    lastSyncStr ? `<span>Last sync: ${lastSyncStr}</span>` : '<span>Never synced</span>',
    ageText ? `<span class="sync-age">${ageText}</span>` : '',
  ].filter(Boolean).join('');

  const card = document.createElement('div');
  card.className = 'memoir-card connector-card';
  card.id = `card-${source}`;
  card.innerHTML = `
    <div class="memoir-header">
      <h3>${source.toUpperCase()}</h3>
      <div class="connector-badges">
        ${enabledBadge(data.enabled)}
        ${statusBadge(data.status)}
      </div>
    </div>
    <div class="memoir-body">
      <div class="connector-meta">${metaLines}</div>
      <div class="connector-stat"><strong>${data.record_count}</strong> records stored</div>
      <div class="connector-action-row">
        <button class="btn" id="sync-btn-${source}">Sync now</button>
        <span class="cooldown-label" id="cooldown-${source}"></span>
      </div>
      <details class="log-details">
        <summary>${(data.log || []).length} attempt${(data.log || []).length === 1 ? '' : 's'} logged</summary>
        ${renderLog(data.log)}
      </details>
    </div>
  `;

  const btn = card.querySelector(`#sync-btn-${source}`);
  const label = card.querySelector(`#cooldown-${source}`);

  if (syncCooldowns[source] && Date.now() < syncCooldowns[source]) btn.disabled = true;

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    label.textContent = 'Syncing…';
    try {
      const resp = await fetch(`/v1/admin/sync/${source}`, { method: 'POST' });
      const json = await resp.json();
      if (resp.ok) {
        label.textContent = `${json.records_synced} record${json.records_synced === 1 ? '' : 's'} synced`;
        setTimeout(loadStatus, 600);
      } else {
        label.textContent = `Error: ${json.detail || 'sync failed'}`;
      }
    } catch (err) {
      label.textContent = `Error: ${err.message}`;
    }
    startCooldown(source, btn, label);
  });

  return card;
}

async function loadStatus() {
  try {
    const resp = await fetch('/v1/connectors/status');
    const data = await resp.json();

    const grid = document.getElementById('connector-grid');
    grid.innerHTML = '';
    for (const source of ['garmin', 'strava']) {
      grid.appendChild(renderConnector(source, data[source]));
    }

    const labels = { garmin: 'Garmin', strava: 'Strava', manual: 'Manual', telegram: 'Telegram' };
    document.getElementById('count-grid').innerHTML =
      Object.entries(data.record_counts).map(([src, n]) =>
        `<div class="count-tile">
          <span class="count-value">${n}</span>
          <span class="count-source">${labels[src] || src}</span>
        </div>`
      ).join('');

  } catch (err) {
    document.getElementById('connector-grid').innerHTML =
      `<div class="error-state">Failed to load: ${err.message}</div>`;
  }
}

loadStatus();
</script>
</body>
</html>
