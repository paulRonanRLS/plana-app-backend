<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>planA — Goals</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar">
  <span class="brand">planA</span>
  <a href="index.html">Now</a>
  <a href="goals.html" class="active">Goals</a>
  <a class="disabled" title="Coming soon">Tension Map</a>
  <a href="reflection.html">Reflection</a>
  <a href="connectors.html">Connectors</a>
</nav>

<main>
  <div class="goals-toolbar">
    <span class="goals-toolbar-title">Active Goals</span>
    <button class="btn btn-primary" id="add-goal-btn">+ Add Goal</button>
  </div>
  <!-- Add Goal Panel -->
  <div id="add-goal-panel" class="add-goal-panel hidden">
    <div class="panel-header-row">
      <span>Add Goal</span>
      <button class="btn" onclick="closeAddGoalPanel()">Cancel</button>
    </div>
    <div class="form-group">
      <label class="form-label">Category</label>
      <select class="form-select" id="goal-category" onchange="onCategoryChange()">
        <option value="">Choose a category…</option>
      </select>
    </div>
    <div id="goal-template-row" class="form-group hidden">
      <label class="form-label">Template</label>
      <select class="form-select" id="goal-template" onchange="onTemplateChange()">
        <option value="">Choose a template…</option>
      </select>
    </div>
    <div id="goal-form-fields" class="hidden">
      <div class="form-group">
        <label class="form-label">Goal name</label>
        <input type="text" class="form-input" id="goal-title" placeholder="e.g. Run a half marathon" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Description <span class="form-optional">(optional)</span></label>
        <textarea class="form-textarea" id="goal-description" rows="2"></textarea>
      </div>
      <div id="goal-type-fields"></div>
      <div class="form-actions">
        <button class="btn btn-primary" id="goal-submit-btn" onclick="submitAddGoal()">Create Goal</button>
        <span id="goal-form-error" class="form-feedback"></span>
      </div>
    </div>
  </div>

  <div id="goals-list">
    <div class="loading">Loading…</div>
  </div>
</main>

<div class="capture-bar">
  <form class="capture-form" id="capture-form">
    <input type="text" class="capture-input" id="capture-input"
           placeholder="What's happening…" autocomplete="off">
    <button type="submit" class="capture-btn" id="capture-btn">Send</button>
  </form>
  <div class="capture-feedback" id="capture-feedback"></div>
</div>

<script src="app.js"></script>
<script>loadGoals();</script>
</body>
</html>
