<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>planA — Goals</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar">
  <span class="brand">planA</span>
  <a href="index.html">Now</a>
  <a href="goals.html" class="active">Goals</a>
  <a class="disabled" title="Coming soon">Tension Map</a>
  <a href="reflection.html">Reflection</a>
  <a href="connectors.html">Connectors</a>
</nav>

<main>
  <div class="goals-toolbar">
    <span class="goals-toolbar-title">Active Goals</span>
    <button class="btn btn-primary" id="add-goal-btn" onclick="openAddGoalWizard()">+ Add Goal</button>
  </div>

  <!-- Multi-step Add Goal Wizard -->
  <div class="add-goal-wizard hidden" id="add-goal-wizard">

    <!-- Step 1: Category selection -->
    <div id="wizard-step-1">
      <div class="wizard-nav">
        <h3>Choose a category</h3>
        <button class="btn" onclick="closeAddGoalWizard()">Cancel</button>
      </div>
      <div class="category-grid" id="wizard-categories"></div>
    </div>

    <!-- Step 2: Template selection -->
    <div id="wizard-step-2" class="hidden">
      <div class="wizard-nav">
        <button class="btn" onclick="wizardGoTo(1)">← Back</button>
        <h3 id="wizard-cat-label">Templates</h3>
        <button class="btn" onclick="closeAddGoalWizard()">Cancel</button>
      </div>
      <div class="template-grid" id="wizard-templates"></div>
    </div>

    <!-- Step 3: Configure form -->
    <div id="wizard-step-3" class="hidden">
      <div class="wizard-nav">
        <button class="btn" id="wizard-back-3" onclick="wizardGoTo(2)">← Back</button>
        <h3 id="wizard-config-label">Configure goal</h3>
        <button class="btn" onclick="closeAddGoalWizard()">Cancel</button>
      </div>
      <form id="wizard-config-form">
        <div id="wizard-config-fields"></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="wizard-submit">Create Goal</button>
          <span class="form-feedback" id="wizard-feedback"></span>
        </div>
      </form>
    </div>

  </div>

  <div id="goals-list">
    <div class="loading">Loading…</div>
  </div>
</main>

<div class="capture-bar">
  <form class="capture-form" id="capture-form">
    <input type="text" class="capture-input" id="capture-input"
           placeholder="What's happening…" autocomplete="off">
    <button type="submit" class="capture-btn" id="capture-btn">Send</button>
  </form>
  <div class="capture-feedback" id="capture-feedback"></div>
</div>

<script src="app.js"></script>
<script>loadGoals();</script>
</body>
</html>
