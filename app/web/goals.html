<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>planA — Goals</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar">
  <span class="brand">planA</span>
  <a href="index.html">Now</a>
  <a href="goals.html" class="active">Goals</a>
  <a href="#" class="disabled">Tension Map</a>
  <a href="reflection.html">Reflection</a>
  <a href="connectors.html">Connectors</a>
</nav>

<main>
  <div class="goals-toolbar">
    <span class="goals-toolbar-title">Active Goals</span>
    <button class="btn btn-primary" id="add-goal-btn" onclick="toggleAddGoalForm()">+ Add Goal</button>
  </div>

  <div class="add-goal-panel hidden" id="add-goal-panel">
    <form id="add-goal-form">
      <div class="form-group">
        <label class="form-label" for="new-goal-title">Goal name</label>
        <input type="text" class="form-input" id="new-goal-title" required
               placeholder="e.g. Run a half marathon">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="new-goal-type">Type</label>
          <select class="form-select" id="new-goal-type" onchange="handleGoalTypeChange()">
            <option value="achievement">Achievement</option>
            <option value="perpetual">Perpetual</option>
            <option value="habit">Habit</option>
          </select>
        </div>
        <div class="form-group" id="deadline-group">
          <label class="form-label" for="new-goal-deadline">Deadline</label>
          <input type="date" class="form-input" id="new-goal-deadline">
        </div>
        <div class="form-group hidden" id="habit-target-group">
          <label class="form-label" for="new-goal-weekly-target">Times per week</label>
          <input type="number" class="form-input" id="new-goal-weekly-target" min="1" max="30" placeholder="5">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="new-goal-description">
          Description <span class="form-optional">(optional)</span>
        </label>
        <textarea class="form-textarea" id="new-goal-description" rows="2"
                  placeholder="What does success look like?"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="add-goal-submit">Create Goal</button>
        <button type="button" class="btn" onclick="toggleAddGoalForm()">Cancel</button>
        <span class="form-feedback" id="add-goal-feedback"></span>
      </div>
    </form>
  </div>

  <div id="goals-list">
    <div class="loading">Loading…</div>
  </div>
</main>

<div class="capture-bar">
  <form class="capture-form" id="capture-form">
    <input type="text" class="capture-input" id="capture-input"
           placeholder="What's happening…" autocomplete="off">
    <button type="submit" class="capture-btn" id="capture-btn">Send</button>
  </form>
  <div class="capture-feedback" id="capture-feedback"></div>
</div>

<script src="app.js"></script>
<script>loadGoals();</script>
</body>
</html>
